services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: controlplay-app
    env_file:
      - .env
    volumes:
      - ./app:/app
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: controlplay-worker
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./worker:/worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker:celery_app worker --loglevel=INFO --queues controlplay
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: controlplay-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controlplay}
      POSTGRES_USER: ${POSTGRES_USER:-controlplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlplay}
    volumes:
      - controlplay-db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controlplay} -d ${POSTGRES_DB:-controlplay}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: controlplay-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  controlplay-db-data:
