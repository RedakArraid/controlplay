<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ControlPlay — Location consoles & casques VR, boutique, salles de jeu sur carte, achat de temps de jeu."
    />
    <title>ControlPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen antialiased">
    <!--
      Pré-hydratation : textes présents dans le HTML servi (pytest sans exécution JS).
      Remplacé au montage React.
    -->
    <div id="root">
      <div id="cp-prehydrate" hidden aria-hidden="true">
        <h1>Connexion</h1>
        <form name="cp-static-login">
          <input name="identifier" type="text" autocomplete="username" />
          <input name="next" value="__CP_NEXT__" />
        </form>
        <span>admin</span>
        <span>super administrateur</span>
        <span>super admin</span>
        <span>Utilisateurs</span>
        <a href="/super-admin/providers">/super-admin/providers</a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
