# Tests unitaires / API (SQLite en mémoire via conftest). Pas de Docker ni Playwright.
name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Pytest (hors E2E navigateur)
        run: python -m pytest tests/ -q -m "not browser"
