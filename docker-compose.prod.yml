services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: controlplay-app
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traefik_network
      - supabase_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.controlplay.rule=Host(`controlplay.soubadigital.com`)
      - traefik.http.routers.controlplay.entrypoints=websecure
      - traefik.http.routers.controlplay.tls=true
      - traefik.http.routers.controlplay.tls.certresolver=mytlschallenge
      - traefik.http.services.controlplay.loadbalancer.server.port=8000
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
      exec uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: controlplay-worker
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A worker:celery_app worker --loglevel=INFO --queues controlplay
    restart: unless-stopped
    networks:
      - supabase_default

  redis:
    image: redis:7-alpine
    container_name: controlplay-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase_default

networks:
  traefik_network:
    external: true
  supabase_default:
    external: true
